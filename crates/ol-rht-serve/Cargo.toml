description = "The transport: the serving layer's query core over gRPC and JSON, public ids on the wire and nothing else."

[lib]
name = "ol_rht_serve"
path = "src/lib.rs"

[[bin]]
name = "ol-rht-serve"
path = "src/main.rs"

[dependencies]
