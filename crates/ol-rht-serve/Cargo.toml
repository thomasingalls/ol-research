[package]
name = "ol-rht-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The transport: the serving layer's query core over gRPC and JSON, public ids on the wire and nothing else."

[lib]
name = "ol_rht_serve"
path = "src/lib.rs"

[[bin]]
name = "ol-rht-serve"
path = "src/main.rs"

[dependencies]
axum.workspace = true
graph.workspace = true
ingest.workspace = true
merge.workspace = true
model.workspace = true
prost.workspace = true
query-parser.workspace = true
search.workspace = true
serde.workspace = true
serde_json.workspace = true
serve.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tonic-prost.workspace = true
tonic-reflection.workspace = true

[dev-dependencies]
proptest.workspace = true
# The descriptor set, read back in `ts.rs` to prove no enum reaches a
# response body. A build-dependency already; this is the same crate.
prost-types.workspace = true
smallvec.workspace = true
# The browser client's TypeScript, generated from these same types (see
# `src/ts.rs`). A dev-dependency, and the derive `build.rs` adds is
# `cfg(test)`: nothing of ts-rs reaches the server binary.
ts-rs.workspace = true
# The JSON surface is tested over a real socket, with the blocking client
# the ingestion side already uses; nothing new enters the tree for it.
ureq.workspace = true

[build-dependencies]
prost.workspace = true
prost-types.workspace = true
protox.workspace = true
tonic-prost-build.workspace = true

[lints]
workspace = true
