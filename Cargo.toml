[workspace]
members = ["crates/*"]
# Third-party crates carried with a change of ours (see [patch.crates-io]):
# not members, so the workspace's lints and builds leave them as published.
exclude = ["vendor"]
resolver = "3"

# Inherited by members via `version.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Internal crates are declared once here so members share one source of truth.
[workspace.dependencies]
model = { path = "crates/model" }
ingest = { path = "crates/ingest" }
merge = { path = "crates/merge" }
graph = { path = "crates/graph" }
serve = { path = "crates/serve" }
search = { path = "crates/search" }
query-parser = { path = "crates/query-parser" }
evaluation = { path = "crates/evaluation" }
source-crossref = { path = "crates/source-crossref" }
source-openalex = { path = "crates/source-openalex" }
source-pubmed = { path = "crates/source-pubmed" }

# External. One version for the whole workspace.
flate2 = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
zstd = "0.13"
# The graph's base files are read through a memory map (graph plan §8):
# a reader is a map and a slice, and at scale the files outsize memory.
memmap2 = "0.9"
# The lexical index (serving plan §3, SP2): embedded, so the sink is a
# library call and the tests run under cargo. The mapping it indexes is
# the user's to set; the engine is a proof-of-concept choice.
tantivy = "0.26"
# The names lookup (serving plan §3): a finite state transducer, mapped
# into memory, sharing every prefix a million DOIs share.
fst = "0.4"
# The public id (serving plan §6): a keyed hash of the WorkId.
blake3 = "1"
# Language identification (tokenizer plan D13), measured in
# `ol-rht-language` alone so no other binary carries a detector's models:
# lingua (pure Rust), its languages chosen by that crate's features — every
# one in the image, a few in a local build short of disk; and a pure-Rust
# reader of fastText models, for GlotLID, whose model is fetched onto the
# box and never built in (docs/inbox/language-identification.md).
lingua = { version = "1.8", default-features = false }
fasttext-pure-rs = "0.1"
# The transport (serving plan §7): gRPC on tonic over hyper 1; protox
# compiles the protocol in pure Rust, so nothing outside cargo is
# installed; reflection and health so grpcurl can drive the server.
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-types = "0.14"
protox = "0.9"
# The JSON facade over the same core (serving plan §7), for a browser,
# which cannot speak gRPC: axum 0.8 over the hyper 1 and tower tonic
# already brings, so the second surface is a router and no new stack.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
# Fetching (plan §3.5): rustls, no transparent decompression — raw bytes
# must land as served — and the two digests the sources publish or imply.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
md-5 = "0.11"
# Inline small arrays (plan §5, rule 1): the common lengths of a record's
# lists fit in the record itself, so parsing one allocates for the rare
# long list only.
smallvec = { version = "1", features = ["serde", "const_generics", "union"] }
# The browser client's TypeScript, generated from the same Rust types the
# JSON is serialized from (serving plan §7). A dev-dependency only: the
# derive exists when `ol-rht-serve` is built for its own tests and never
# in the server. `serde-compat` is on by default and is what makes the
# generated field names the ones serde writes.
ts-rs = "12"
# Property-based tests, Hypothesis's shape in Rust: generated inputs,
# shrunk to the smallest that fails (the user, 2026-09-25: the strong
# preference, here and in general). Dev-dependency only.
proptest = "1"
# The allocator under both binaries (deployment plan §2): the dev store's
# rebuild ran 7-8% faster on it than on the system's (2026-09-29). Built
# from its C source, with the compiler zstd needs anyway.
mimalloc = "0.1"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# --- compile time ---------------------------------------------------------
# Profiles are only honoured in the workspace root manifest.

[profile.dev]
# Full debuginfo is a large share of both codegen and link time. Line tables
# keep file/line in backtraces and panics; they drop local-variable info, so
# step-debugging in lldb gets thinner. Set `debug = true` if you need that.
debug = "line-tables-only"

[profile.dev.package."*"]
# You rarely step into third-party code, so don't pay to generate its
# debuginfo. Applies to dependencies only, never to workspace members.
debug = false

# fasttext-pure-rs with its allocation guard raised so GlotLID v3 loads
# (vendor/fasttext-pure-rs/VENDORED.md; tokenizer plan section 7).
[patch.crates-io]
fasttext-pure-rs = { path = "vendor/fasttext-pure-rs" }
