# `cargo check` skips codegen and linking entirely, so it is several times
# faster than `build`. Make it the cheap default in the edit loop.
[alias]
c = "check --workspace --all-targets"
l = "clippy --workspace --all-targets"
t = "test --workspace"

# The image is built and run on the homelab tower (deployment plan §2).
# Rust's default x86-64 target is the 2003 baseline, without even POPCNT;
# x86-64-v3 lets the compiler use AVX2, BMI2, FMA and POPCNT throughout.
# A CPU without them cannot run the binary at all (illegal instruction at
# start), so every machine that runs the image must have x86-64-v3; ask a
# new one with `/lib64/ld-linux-x86-64.so.2 --help | grep x86-64-v3` in a
# Jammy container before it serves. Only Linux x86-64 builds read this.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]
